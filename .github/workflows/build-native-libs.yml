
name: Build Native Libraries

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  build-macos:
    name: Build macOS dylib
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build frost-ffi for macOS
        working-directory: frost-ffi
        run: cargo build --release

      - name: Upload macOS dylib
        uses: actions/upload-artifact@v4
        with:
          name: libfrost_ffi-macos
          path: frost-ffi/target/release/libfrost_ffi.dylib

  build-linux:
    name: Build Linux .so
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build frost-ffi for Linux
        working-directory: frost-ffi
        run: cargo build --release

      - name: Upload Linux .so
        uses: actions/upload-artifact@v4
        with:
          name: libfrost_ffi-linux
          path: frost-ffi/target/release/libfrost_ffi.so

  build-linux-arm64:
    name: Build Linux arm64 .so
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install aarch64 cross linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build frost-ffi for Linux arm64
        working-directory: frost-ffi
        run: cargo build --release --target aarch64-unknown-linux-gnu

      - name: Verify architecture
        run: file frost-ffi/target/aarch64-unknown-linux-gnu/release/libfrost_ffi.so

      - name: Upload Linux arm64 .so
        uses: actions/upload-artifact@v4
        with:
          name: libfrost_ffi-linux-arm64
          path: frost-ffi/target/aarch64-unknown-linux-gnu/release/libfrost_ffi.so
