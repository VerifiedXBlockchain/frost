
name: Build Native Libraries

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  build-macos:
    # Universal (x86_64 + arm64), as the library Core ships: a runner-native build alone left Intel Macs without one.
    name: Build macOS universal dylib
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Build frost-ffi for x86_64
        working-directory: frost-ffi
        run: cargo build --release --target x86_64-apple-darwin

      - name: Build frost-ffi for aarch64
        working-directory: frost-ffi
        run: cargo build --release --target aarch64-apple-darwin

      - name: Create universal binary
        run: |
          lipo -create             frost-ffi/target/x86_64-apple-darwin/release/libfrost_ffi.dylib             frost-ffi/target/aarch64-apple-darwin/release/libfrost_ffi.dylib             -output libfrost_ffi.dylib
          lipo -info libfrost_ffi.dylib

      - name: Upload macOS universal dylib
        uses: actions/upload-artifact@v4
        with:
          name: libfrost_ffi-macos
          path: libfrost_ffi.dylib

  build-windows:
    name: Build Windows DLL
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build frost-ffi for Windows
        working-directory: frost-ffi
        run: cargo build --release

      - name: Upload Windows DLL
        uses: actions/upload-artifact@v4
        with:
          name: frost_ffi-windows
          path: frost-ffi/target/release/frost_ffi.dll

  build-linux:
    name: Build Linux .so
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build frost-ffi for Linux
        working-directory: frost-ffi
        run: cargo build --release

      - name: Upload Linux .so
        uses: actions/upload-artifact@v4
        with:
          name: libfrost_ffi-linux
          path: frost-ffi/target/release/libfrost_ffi.so

  build-linux-arm64:
    name: Build Linux arm64 .so
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install aarch64 cross linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build frost-ffi for Linux arm64
        working-directory: frost-ffi
        run: cargo build --release --target aarch64-unknown-linux-gnu

      - name: Verify architecture
        run: file frost-ffi/target/aarch64-unknown-linux-gnu/release/libfrost_ffi.so

      - name: Upload Linux arm64 .so
        uses: actions/upload-artifact@v4
        with:
          name: libfrost_ffi-linux-arm64
          path: frost-ffi/target/aarch64-unknown-linux-gnu/release/libfrost_ffi.so
